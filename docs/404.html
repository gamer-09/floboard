<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FloBoard</title>
    <script>
      (function () {
        var repo = '/floboard';
        var path = location.pathname;
        if (path.indexOf(repo) === 0) path = path.slice(repo.length);
        if (!path || path === '/') path = '/markets';
        if (path.charAt(0) !== '/') path = '/' + path;
        location.replace(repo + '/#' + path + location.search);
      })();
    </script>
  </head>
  <body></body>
</html>
